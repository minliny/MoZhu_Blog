name: Deploy Blog

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [notion_publish]
  schedule:
    - cron: '17,47 * * * *'

permissions:
  contents: read
  models: read

concurrency:
  group: pages-${{ github.repository }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'schedule' || github.event.repository.name == format('{0}.github.io', github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: blog-frontend
    env:
      ALLOW_EMPTY_NOTION_SYNC: '0'

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: blog-frontend/package-lock.json

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Install dependencies
        run: npm ci

      - name: Select content source
        id: content
        shell: bash
        run: |
          if [ "$GITHUB_REPOSITORY" = "${GITHUB_REPOSITORY_OWNER}/${GITHUB_REPOSITORY_OWNER}.github.io" ]; then
            echo "mode=notion" >> "$GITHUB_OUTPUT"
          else
            echo "mode=fixtures" >> "$GITHUB_OUTPUT"
          fi

      - name: Derive site URL
        shell: bash
        run: |
          if [ "$GITHUB_REPOSITORY" = "${GITHUB_REPOSITORY_OWNER}/${GITHUB_REPOSITORY_OWNER}.github.io" ]; then
            echo "SITE_URL=https://${GITHUB_REPOSITORY_OWNER}.github.io" >> "$GITHUB_ENV"
          else
            echo "SITE_URL=https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}" >> "$GITHUB_ENV"
          fi

      - name: Diagnose Notion connection
        if: steps.content.outputs.mode == 'notion'
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: npm run doctor:notion

      - name: Sync Notion snapshot
        if: steps.content.outputs.mode == 'notion'
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          CONTENT_DIR: .content/notion
          AI_SUMMARY_TOKEN: ${{ github.token }}
          AI_SUMMARY_MODEL: openai/gpt-4.1-mini
          AI_SUMMARY_WRITEBACK: '1'
        run: npm run sync:notion

      - name: Test content and build code
        run: npm test

      - name: Build Notion site
        if: steps.content.outputs.mode == 'notion'
        env:
          CONTENT_DIR: .content/notion
        run: npm run build:notion

      - name: Build fixture site
        if: steps.content.outputs.mode == 'fixtures'
        run: npm run build:fixtures

      - name: Validate publish artifact
        run: npm run validate

      - name: Upload immutable site snapshot
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: site-snapshot-${{ github.sha }}-${{ github.run_id }}
          path: blog-frontend/dist
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: blog-frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  smoke:
    needs: deploy
    if: needs.deploy.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check published home and manifest
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          curl --fail --location --silent --show-error --retry 8 --retry-all-errors --retry-delay 5 "$PAGE_URL"
          curl --fail --location --silent --show-error --retry 8 --retry-all-errors --retry-delay 5 "${PAGE_URL%/}/content-manifest.json"
